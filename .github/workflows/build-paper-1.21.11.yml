name: CivCraft Paper 1.21.11

# Automatic checks are paused while building the first playable test release.
# Re-enable push/PR triggers only after the user approves the testing milestone.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and package CivCraft
        run: mvn --batch-mode --no-transfer-progress -pl civcraft-leaf -am clean package
      - name: Verify plugin packaging
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find civcraft-leaf/target -maxdepth 1 -name 'civcraft-leaf-*.jar' ! -name 'original-*' | head -1)"
          test -n "$JAR"
          unzip -Z1 "$JAR" | grep -Fxq plugin.yml
          unzip -Z1 "$JAR" | grep -Fxq config.yml
          unzip -Z1 "$JAR" | grep -Fxq civcraft/data/techs.yml
          unzip -Z1 "$JAR" | grep -Fxq civcraft/data/structures.yml
          echo "Plugin packaged: $JAR"
      - name: Upload build for testing
        uses: actions/upload-artifact@v4
        with:
          name: civcraft-1.21.11-snapshot
          path: |
            civcraft-leaf/target/civcraft-leaf-*.jar
            !civcraft-leaf/target/original-*.jar
          if-no-files-found: error

  smoke:
    name: Paper 1.21.11 server smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download compiled CivCraft jar
        uses: actions/download-artifact@v4
        with:
          name: civcraft-1.21.11-snapshot
          path: smoke-artifact
      - name: Launch Paper and verify startup, commands, SQLite and restart
        shell: bash
        run: bash .github/scripts/smoke-paper-1.21.11.sh
      - name: Collect container logs
        if: always()
        shell: bash
        run: |
          mkdir -p smoke-output
          docker logs civcraft-smoke > smoke-output/server.log 2>&1 || true
          if [ -d smoke-data/logs ]; then
            cp -r smoke-data/logs smoke-output/ || true
          fi
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: civcraft-1.21.11-runtime-logs
          path: smoke-output/
          if-no-files-found: ignore
