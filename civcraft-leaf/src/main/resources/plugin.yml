name: CivCraft
main: com.avrgaming.civcraft.modern.CivCraftModernPlugin
version: 2.0.0-1.21.11-SNAPSHOT
api-version: '1.21.11'
authors: [AvRGaming, MineTexas, CivCraft Port Team]
description: Modern CivCraft port targeting Paper and compatible Leaf 1.21.11 servers.
load: STARTUP
softdepend:
  - MythicMobs
  - MMOItems
  - dynmap
  - ExcellentEconomy
  - Vault
  - PlaceholderAPI
  - FastAsyncWorldEdit
  - WorldEdit
  - packetevents
  - DecentHolograms
  - FancyNpcs
  - ItemsAdder
commands:
  resident:
    aliases: [res]
    description: CivCraft recipe book.
    usage: /<command> book
    permission: civcraft.use
  camp:
    aliases: [c]
    description: Camp mechanics owned by CivCraft.
    usage: /<command> [info|invite|kick|promote|lower|setleader|disband|leave|tp|upgrade]
    permission: civcraft.use
  civ:
    description: Civilization mechanics owned by CivCraft.
    usage: /<command> [help|create|info|members|invite <player>|join|leave|kick <player>|setleader <player>|deposit|withdraw]
    permission: civcraft.use
  town:
    aliases: [t]
    description: Town mechanics owned by CivCraft.
    usage: /<command> [help|create|info|members|invite <player>|join|leave|kick <player>|setmayor <player>|claim|unclaim|claims|deposit|withdraw]
    permission: civcraft.use
  build:
    aliases: [b]
    description: Shows private structure preview and starts construction after yes.
    usage: /<command> <structureId> [y] [0|90|180|270]
    permission: civcraft.use
  research:
    aliases: [tech]
    description: Starts and shows civilization technology research.
    usage: /<command> [list|start <id>|status|rate]
    permission: civcraft.use
  civadmin:
    aliases: [ad]
    description: CivCraft admin tools.
    usage: /<command> [reload|integrations|recovery status|npc reload|foundation give <player> <camp|civilization|town> [amount]|funds give <player> <amount>|build <legacyFile> [y] [0|90|180|270]]
    permission: civcraft.admin
permissions:
  civcraft.use:
    default: true
  civcraft.admin:
    default: op
