name: CivCraft
main: com.avrgaming.civcraft.modern.CivCraftModernPlugin
version: 2.0.0-1.21.11-SNAPSHOT
api-version: '1.21.11'
authors: [AvRGaming, MineTexas, CivCraft Port Team]
description: CivCraft для серверов Paper и совместимых Leaf 1.21.11.
load: STARTUP
softdepend:
  - MythicMobs
  - MMOItems
  - dynmap
  - ExcellentEconomy
  - Vault
  - PlaceholderAPI
  - FastAsyncWorldEdit
  - WorldEdit
  - packetevents
  - DecentHolograms
  - FancyNpcs
  - ItemsAdder
commands:
  spy:
    description: Шпионаж, книги миссий и состояние раскрытия.
    usage: /<command> [list|equip|start <ID>|confirm yes|status|cancel]
    permission: civcraft.use
  plot:
    description: Покупка, продажа и права участка города.
    usage: /<command> [info|fs <цена>|nfs|buy|setowner <ник>|perm set|toggle <mobs|fire>]
    permission: civcraft.use
  resident:
    aliases: [res]
    description: Рецепты, местность, налоги, дозор и PvP-защита.
    usage: /<command> [book|biome|taxes|paydebt|pvptimer|toggle showscout]
    permission: civcraft.use
  camp:
    aliases: [c]
    description: Развитие лагеря, участники, улучшения и роспуск.
    usage: /<command> [info|invite|kick|promote|lower|setleader|disband|leave|tp|upgrade]
    permission: civcraft.use
  civ:
    description: Цивилизация, участники, руководство и казна.
    usage: /<command> [help|create|info|members|invite <ник>|join|leave|kick <ник>|setleader <ник>|deposit|withdraw]
    permission: civcraft.use
  town:
    aliases: [t]
    description: Город, жители, участки, мэр и казна.
    usage: /<command> [help|create|info|members|invite <ник>|join|leave|kick <ник>|setmayor <ник>|claim|unclaim|claims|deposit|withdraw]
    permission: civcraft.use
  build:
    aliases: [b]
    description: Предпросмотр здания и начало строительства после подтверждения словом yes.
    usage: /<command> <ID_постройки> [высота] [0|90|180|270]
    permission: civcraft.use
  research:
    aliases: [tech]
    description: Список технологий, начало и состояние исследований цивилизации.
    usage: /<command> [list|start <ID>|status|rate]
    permission: civcraft.use
  civadmin:
    aliases: [ad]
    description: Администрирование CivCraft, выдача предметов и восстановление операций.
    usage: /<command> [reload|integrations|recovery status|npc reload|foundation give <ник> <camp|civilization|town> [количество]|funds give <ник> <количество>|build <шаблон> [высота] [0|90|180|270]]
    permission: civcraft.admin
permissions:
  civcraft.use:
    default: true
  civcraft.admin:
    default: op
