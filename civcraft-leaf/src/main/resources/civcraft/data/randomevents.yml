# ========== Opportunities ============

    - id: 'event_herbs'
      name: "Лечебные травы"
      chance: 50
      message:
        - "Наши учёные считают, что нашли способ вылечить одну из болезней, давно мучающих цивилизацию."
        - "Если мы принесём нужные травы, у них появится шанс создать лекарство и повысить счастье города."
        - "На поиски трав у нас есть 8 часов."
      length: 8
      actions:
        - name: 'PickRandomLocation'
          varname: 'loc'
      requirements:
        - name: 'LocationCheck'
          varname: 'loc'
      success:
         - name: 'MessageTown'
           message: "Травы найдены! Жители ликуют!"
         - name: 'Happiness'
           value: '5'
           duration: '120'
      failure:
         - name: 'MessageTown'
           message: "Мы не успели найти травы вовремя!"
 
    - id: 'event_gold_rush'
      name: "Золотая лихорадка!"
      chance: 50
      message:
        - "По городу ходят слухи о большом тайнике монет, спрятанном где-то в мире."
        - "Найдите блок с тайником и сломайте его, чтобы получить огромную награду!"
        - "Награду получит первый, кто сломает этот блок. На поиски монет есть 12 часов."
      length: 12
      actions:
        - name: 'PickRandomBlock'
          varname: 'loc'
      requirements:
        - name: 'BlockBreak'
          varname: 'loc'
          playername_var: 'player'
      success:
         - name: 'MessageTown'
           message: "Один из жителей нашёл тайник с монетами!"
         - name: 'PayPlayer'
           playername_var: 'player'
           amount: '75000'
      failure:
         - name: 'MessageTown'
           message: "Мы не успели найти монеты вовремя!"
        
