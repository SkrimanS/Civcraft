settings:
  # Сколько квестов показывать для одного уровня лагеря.
  # Если в levels.<level> настроено больше, лишние не попадут в меню.
  max-visible-per-level: 21

# Логика уровней:
# - лагерь 1 уровня видит и выполняет только quests из levels.'1'
# - лагерь 2 уровня видит и выполняет только quests из levels.'2'
# - старые квесты после повышения уровня больше не отображаются и не принимают прогресс
# - выбора активных квестов нет, все квесты текущего уровня доступны сразу
#
# Типы objective:
# ITEM_DELIVERY - сдача предметов через меню квестов
# MOB_KILL - убийство ванильных entity-types и/или MythicMobs
# LOCATION_VISIT - поход в координаты; координаты показываются через {coordinates}
#
# Типы rewards:
# MONEY, VANILLA_ITEM/ITEM, ITEMSADDER, MMOITEMS, CIVCRAFT_ITEM, CAMP_EXPERIENCE, CONTROL_HP,
# UPGRADE, HEALTH_BONUS, DAMAGE_BONUS, COMMAND
#
# Награда CivCraft item из папки custom-items:
# rewards:
#   - type: CIVCRAFT_ITEM
#     id: bronze_sword
#     amount: 1
levels:
  '1':
    sugar_cane_640:
      title: 'Собрать 640 тростника'
      description: 'Собрано {progress}/{target} тростника'
      objective:
        type: ITEM_DELIVERY
        target: 640
        accepted-items:
          - material: SUGAR_CANE
      icon:
        material: SUGAR_CANE
        name: '&aСобрать 640 тростника'
        lore:
          - '&7Собрано: &e{progress}/{target} &7тростника'
          - '&7Сдавать могут все участники лагеря.'
          - '&aЛКМ, чтобы сдать предметы.'
      rewards:
        - type: MONEY
          amount: 250
        - type: CAMP_EXPERIENCE
          amount: 50
        - type: VANILLA_ITEM
          material: BREAD
          amount: 16
        - type: CIVCRAFT_ITEM
          id: camp_ration
          amount: 2
    wheat_640:
      title: 'Собрать 640 пшеницы'
      description: 'Собрано {progress}/{target} пшеницы'
      objective:
        type: ITEM_DELIVERY
        target: 640
        accepted-items:
          - material: WHEAT
      icon:
        material: WHEAT
        name: '&eСобрать 640 пшеницы'
        lore:
          - '&7Собрано: &e{progress}/{target} &7пшеницы'
          - '&aЛКМ, чтобы сдать предметы.'
      rewards:
        - type: MONEY
          amount: 250
    zombie_kill_25:
      title: 'Убить 25 зомби'
      description: 'Убито {progress}/{target} зомби'
      objective:
        type: MOB_KILL
        target: 25
        entity-types: [ZOMBIE]
      icon:
        material: ROTTEN_FLESH
        name: '&cУбить 25 зомби'
        lore:
          - '&7Убито: &e{progress}/{target}'
          - '&7Прогресс засчитывается автоматически.'
      rewards:
        - type: CONTROL_HP
          amount: 5
    mythic_example:
      title: 'Убить 10 кастомных мобов'
      description: 'Убито {progress}/{target}'
      objective:
        type: MOB_KILL
        target: 10
        mythicmobs: [forest_bandit]
      icon:
        material: IRON_SWORD
        name: '&cУбить кастомных мобов'
        lore:
          - '&7Убито: &e{progress}/{target}'
          - '&8MythicMobs id: forest_bandit'
      rewards:
        - type: MMOITEMS
          mmoitems-type: MATERIAL
          mmoitems-id: EXAMPLE_REWARD
          amount: 1
    visit_example:
      title: 'Дойти до точки'
      description: 'Посещено {progress}/{target}'
      objective:
        type: LOCATION_VISIT
        target: 1
        locations:
          - world: world
            x: 0
            y: 64
            z: 0
            radius: 5
      icon:
        material: COMPASS
        name: '&bДойти до точки'
        lore:
          - '&7Посещено: &e{progress}/{target}'
          - '&7Координаты: &e{coordinates}'
          - '&7Прогресс засчитывается автоматически.'
      rewards:
        - type: HEALTH_BONUS
          amount: 2
        - type: DAMAGE_BONUS
          amount: 0.5
    potato_640:
      title: 'Собрать 640 картошки'
      description: 'Собрано {progress}/{target} картошки'
      objective: {type: ITEM_DELIVERY, target: 640, accepted-items: [{material: POTATO}]}
      icon: {material: POTATO, name: '&eСобрать 640 картошки', lore: ['&7Собрано: &e{progress}/{target} &7картошки', '&aЛКМ, чтобы сдать предметы.']}
      rewards: []
